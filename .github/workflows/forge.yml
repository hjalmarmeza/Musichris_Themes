name: 💎 MusiChris Themes Forge

on:
  schedule:
    - cron: '0 19 * * *' # Todos los días a las 19:00 UTC (13:00 MX / 21:00 ES)
  workflow_dispatch:
    inputs:
      theme:
        description: 'Noticia, Link o Comentario (deja vacío para usar Gmail)'
        required: false
        default: ''

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 🎥 Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 📦 Install Dependencies
        run: |
          npm install
          pip install google-auth-oauthlib google-api-python-client Pillow gdown

      - name: 🌍 Abastecimiento de Paisajes
        run: |
          mkdir -p assets/backgrounds
          # Descarga la carpeta de Google Drive directamente a assets/backgrounds
          gdown --folder --id 13phD_lCgjsFcKXwkLmpAUxtG27GBfhRO -O assets/backgrounds/ --remaining-ok

      - name: 🔐 Reconstruct Credentials
        run: |
          echo "${{ secrets.YOUTUBE_CLIENT_SECRETS_BASE64 }}" | base64 -d > src/client_secrets.json
          echo "${{ secrets.YOUTUBE_TOKEN_BASE64 }}" | base64 -d > src/token.pickle
          echo "CEREBRAS_API_KEY=${{ secrets.CEREBRAS_API_KEY }}" >> .env
          echo "DEEPINFRA_API_KEY=${{ secrets.DEEPINFRA_API_KEY }}" >> .env
          echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" >> .env


      - name: 🚀 Forge, Render & Publish
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
        run: node src/forge_dispatch.js "${{ github.event.inputs.theme }}"
