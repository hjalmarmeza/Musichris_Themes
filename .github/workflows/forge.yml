name: 💎 MusiChris Themes Forge

on:
  schedule:
    - cron: '15 10 * * *' # Todos los días a las 10:15 UTC (12:15 España / 04:15 México)
  workflow_dispatch:
    inputs:
      theme:
        description: 'Noticia, Link o Comentario (deja vacío para usar Gmail)'
        required: false
        default: ''

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 🎥 Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 📦 Install Dependencies
        run: |
          npm install
          pip install google-auth-oauthlib google-api-python-client Pillow gdown

      - name: 🌍 Abastecimiento de Paisajes
        run: |
          mkdir -p assets/backgrounds
          # gdown 5.x+ usa la URL completa directamente sin --id
          gdown --folder "https://drive.google.com/drive/folders/13phD_lCgjsFcKXwkLmpAUxtG27GBfhRO" -O assets/backgrounds/ || echo "⚠️ gdown falló, continuando sin imágenes de fondo..."

      - name: 🔐 Reconstruct Credentials
        run: |

          echo "CEREBRAS_API_KEY=${{ secrets.CEREBRAS_API_KEY }}" >> .env
          echo "DEEPINFRA_API_KEY=${{ secrets.DEEPINFRA_API_KEY }}" >> .env
          echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" >> .env

      - name: 🔍 Validate Token Secret
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python3 - <<'EOF'
          import os, json
          raw = os.environ.get('YOUTUBE_TOKEN_JSON', '')
          if not raw:
              print('❌ YOUTUBE_TOKEN_JSON is EMPTY or NOT SET')
              exit(1)
          try:
              data = json.loads(raw.strip())
              keys = list(data.keys())
              print(f'✅ Token secret parsed OK. Fields: {keys}')
              for required in ['client_id','client_secret','refresh_token','token_uri']:
                  status = '✅' if data.get(required) else '❌ MISSING'
                  print(f'  {status} {required}')
          except Exception as e:
              print(f'❌ JSON parse error: {e}')
              exit(1)
          EOF


      - name: 🚀 Forge, Render & Publish
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
        run: node src/forge_dispatch.js "${{ github.event.inputs.theme }}"
